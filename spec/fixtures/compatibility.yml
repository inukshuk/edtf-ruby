# Non-standard syntax specific to EDTF-Ruby (masked precision, qualifiers).
extensions:
  - input: "198x"
    type: "decade"
    year: 1980
    bounds: ["1980-01-01", "1989-12-31"]
    edtf: "198x"
  - input: "18xx"
    type: "century"
    year: 1800
    bounds: ["1800-01-01", "1899-12-31"]
    edtf: "18xx"
  - input: "2001-02-03^xyz"
    type: "date"
    values: [2001, 2, 3]
    calendar: "xyz"
    edtf: "2001-02-03^xyz"
  - input: "2001-02-03^julian"
    type: "date"
    values: [2001, 2, 3]
    calendar: "julian"
    edtf: "2001-02-03^julian"
  - input: "2001-21^southern"
    type: "season"
    year: 2001
    season: "spring"
    qualifier: "southern"
    bounds: ["2001-03-01", "2001-05-31"]
    edtf: "2001-21^southern"
  - input: "2003-23^european"
    type: "season"
    year: 2003
    season: "autumn"
    qualifier: "european"
    bounds: ["2003-09-01", "2003-11-30"]
    edtf: "2003-23^european"
  - input: "2001-21?"
    type: "season"
    year: 2001
    season: "spring"
    uncertain: true
    bounds: ["2001-03-01", "2001-05-31"]
    edtf: "2001-21?"
    note: "qualified seasons (edtf.js accepts these only at its non-standard level 3)"
  - input: "2001-21~"
    type: "season"
    year: 2001
    season: "spring"
    approximate: true
    bounds: ["2001-03-01", "2001-05-31"]
    edtf: "2001-21~"
  - input: "2001-21%"
    type: "season"
    year: 2001
    season: "spring"
    uncertain: true
    approximate: true
    bounds: ["2001-03-01", "2001-05-31"]
    edtf: "2001-21?~"
  - input: "2003-23?"
    type: "season"
    year: 2003
    season: "autumn"
    uncertain: true
    bounds: ["2003-09-01", "2003-11-30"]
    edtf: "2003-23?"
  - input: "2003-23~"
    type: "season"
    year: 2003
    season: "autumn"
    approximate: true
    bounds: ["2003-09-01", "2003-11-30"]
    edtf: "2003-23~"
  - input: "2003-23%"
    type: "season"
    year: 2003
    season: "autumn"
    uncertain: true
    approximate: true
    bounds: ["2003-09-01", "2003-11-30"]
    edtf: "2003-23?~"
  - input: "[1984, 1990?]"
    type: "choice"
    members: ["1984", "1990?"]
    edtf: "[1984,1990?]"
    note: "qualified set members (edtf.js rejects these)"
  - input: "{1984~,1985}"
    type: "list"
    members: ["1984~", "1985"]
    edtf: "{1984~,1985}"

# Accepted today, but arguably wrong. Pinned so that any change is deliberate.
quirks:
  - input: "-0000"
    type: "date"
    values: [0]
    edtf: "0000"
    note: "negative year zero is accepted and normalized to 0000 (edtf.js rejects it)"
  - input: "XXXX"
    type: "unknown"
    edtf: "uuuu"
    note: "parsed as EDTF::Unknown, not as a date with an unspecified year"
  - input: "2016-05-02T24:00:00"
    type: "datetime"
    values: [2016, 5, 3, 0, 0, 0]
    offset: "+00:00"
    edtf: "2016-05-03T00:00:00"
    note: "24:00 rolls over to the next day"

