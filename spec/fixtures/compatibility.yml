# Compatibility baseline for the EDTF parser.
#
# Each entry records how EDTF-Ruby 4.x parses an input string. The
# attributes are produced by EDTF::Compatibility.describe (see
# spec/support/compatibility.rb); only non-default attributes are listed.
# The 'edtf' attribute is the current output and will change when the
# output switches to ISO 8601-2 syntax.
#
# Entries in 'unsupported' are valid EDTF that the parser rejects today.
# They run as pending examples and need a full description once supported.

# EDTF 2019 level 0 (ISO 8601-1 dates, date-times and intervals).
level_0:
